description: >-
  FinOps view of Sonix spend. Sonix cost is driven primarily by hours of audio
  and video transcribed and translated, plus AI-workspace hours consumed by AI
  analysis. On pay-as-you-go the rate is a flat $10 per hour; on the Core,
  Advanced, and Pro subscriptions a monthly (or annual) fee bundles a block of
  transcription/translation and AI hours plus storage, with per-seat add-ons.
  API usage draws down the same allowances as the web app, so programmatic
  transcription is metered identically. Enterprise agreements cover high-volume
  and compliance-driven usage with custom pricing.
notes: >-
  Per-unit rates were sourced from the public Sonix pricing page and are not
  reconciled against a live invoice here. The dominant cost meters are
  transcription/translation hours and AI-workspace hours; storage is a
  secondary, plan-bounded quota. Verify current rates at https://sonix.ai/pricing.
