meters:
- name: transcription_hours
  description: Hours of audio/video transcribed and translated, billed at $10/hr on pay-as-you-go or drawn from a plan's bundled hours.
  unit: hours
  aggregation: sum
  dimensions:
  - account
  - folder
- name: ai_workspace_hours
  description: Hours of AI analysis (summaries, chapters, sentiment, entities) drawn from the AI-workspace allowance.
  unit: hours
  aggregation: sum
  dimensions:
  - account
- name: storage
  description: Media and transcript storage held in the account, bounded by plan quota (5 GB to 100 GB).
  unit: bytes
  aggregation: max
  dimensions:
  - account
- name: seats
  description: Additional user seats beyond the one included per plan, at $25/mo each.
  unit: seats
  aggregation: max
  dimensions:
  - account
principles:
- name: Visibility
  description: Track transcription/translation hours and AI-workspace hours per account and folder; monitor consumption against the plan's monthly allowance.
- name: Allocation
  description: Organize media into folders per team or project so hours and storage map to internal cost centers.
- name: Optimization
  description: Choose pay-as-you-go vs a subscription based on monthly hour volume; scope AI analysis to media that needs it; prune stored media to stay within the storage quota.
- name: Accountability
  description: Assign owners per folder and review monthly hour and seat usage against the subscription tier before overage or upgrade.
