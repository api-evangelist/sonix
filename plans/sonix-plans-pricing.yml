    Contact Sonix.
  entries:
  - label: Enterprise Agreement
    name: enterprise
    type: flat
    metric: contract
    limit: -1
    timeFrame: year
    geo: global
    unit: 1
    price: custom pricing (contact sales)
    userMultiplied: false
  elements:
  - name: Custom Volume Pricing
  - name: SOC 2 / HIPAA / GDPR Compliance
  - name: Dedicated Support
