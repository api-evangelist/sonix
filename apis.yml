name: Sonix
kind: company
description: Sonix is an AI-powered platform for automated audio and video transcription,
  subtitles, and translation. It transcribes in 54+ languages with speaker labels
  and word-level timestamps, translates transcripts into 55+ languages, generates
  subtitles and captions (SRT, VTT, TXT, JSON, DOCX, PDF), and runs AI analysis
  (summaries, chapters, sentiment, entities). The Sonix REST API - available to
  subscribers - lets developers upload media, poll transcription status, retrieve
  and edit transcripts, export subtitles, and translate, all authorized with a
  Bearer API key against https://api.sonix.ai/v1.
